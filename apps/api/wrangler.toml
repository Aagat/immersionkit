name = "immersionkit-api-example"
main = "src/index.ts"
compatibility_date = "2026-05-18"

[vars]
ASSET_PUBLIC_BASE_URL = "https://assets.example.invalid/assets"
GOOGLE_REDIRECT_URI = "https://bpjgahibdabhcbdmoakjbgdobkknfaek.chromiumapp.org/oauth/google"
SESSION_TTL_DAYS = "30"
OAUTH_STATE_TTL_MINUTES = "10"

[[d1_databases]]
binding = "DB"
database_name = "immersionkit-preview-example"
# Replace this with the id returned by:
# pnpm --filter @immersionkit/api exec wrangler d1 create immersionkit-preview-example
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "immersionkit-asset-releases-example"

# Explicit preview environment for the currently deployed commercial preview.
# Keep the top-level config as the default compatibility path until a separate
# production Worker/D1/R2/OAuth set exists.
[env.preview]
name = "immersionkit-api-example"

[env.preview.vars]
ASSET_PUBLIC_BASE_URL = "https://assets.example.invalid/assets"
GOOGLE_REDIRECT_URI = "https://bpjgahibdabhcbdmoakjbgdobkknfaek.chromiumapp.org/oauth/google"
SESSION_TTL_DAYS = "30"
OAUTH_STATE_TTL_MINUTES = "10"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "immersionkit-preview-example"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "immersionkit-asset-releases-example"
