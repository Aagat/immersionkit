<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImmersionKit Validation Harness</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "IBM Plex Sans",
          "Avenir Next",
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(180deg, #fffdf6 0%, #f3f5ff 100%);
        color: #1d1f2a;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      h1,
      h2 {
        margin: 0 0 10px;
      }

      section {
        margin-top: 24px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #e6e8f3;
        border-radius: 10px;
      }

      p {
        margin: 6px 0;
      }

      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #d9ddf0;
        padding: 8px;
        text-align: left;
      }

      th {
        background: #f3f6ff;
      }

      pre {
        overflow-x: auto;
        white-space: pre-wrap;
        background: #0f172a;
        color: #d6e6ff;
        padding: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/validation/phrase-detection-page.ts"></script>
  </body>
</html>
