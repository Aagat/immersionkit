<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImmersionKit Word Injection Validation</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #112132;
        --muted: #4b5c6f;
        --line: #d9e2ec;
        --pass: #0b6b42;
        --fail: #9c1c1c;
        --table-stripe: #f8fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, #d5ecff 0%, transparent 45%),
          radial-gradient(circle at bottom left, #fce6d1 0%, transparent 40%),
          var(--bg);
      }

      main {
        width: min(1200px, 94vw);
        margin: 2rem auto 3rem;
        display: grid;
        gap: 1rem;
      }

      .ik-validation-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        box-shadow: 0 10px 20px rgba(17, 33, 50, 0.06);
      }

      h1,
      h2 {
        margin: 0 0 0.6rem;
      }

      p {
        margin: 0.4rem 0;
        color: var(--muted);
      }

      .ik-status-pass {
        color: var(--pass);
        font-weight: 700;
      }

      .ik-status-fail {
        color: var(--fail);
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 0.5rem;
        text-align: left;
        vertical-align: top;
      }

      tbody tr:nth-child(odd) {
        background: var(--table-stripe);
      }

      ul {
        margin: 0;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.82rem;
        line-height: 1.45;
      }

      @media (max-width: 760px) {
        th,
        td {
          font-size: 0.8rem;
          padding: 0.42rem;
        }
      }
    </style>
  </head>
  <body>
    <main data-ik-validation-root="word-injection">
      <section class="ik-validation-card">
        <h1>Word Injection Validation</h1>
        <p>Loading browser-run validation harness...</p>
      </section>
    </main>
    <script type="module" src="/src/validation/main.ts"></script>
  </body>
</html>
