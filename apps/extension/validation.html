<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImmersionKit Sentence Suitability Validation</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5ef;
        --surface: #ffffff;
        --ink: #1f2937;
        --muted: #526275;
        --accent: #0f766e;
        --pass: #166534;
        --fail: #9f1239;
        --border: #d5d8db;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 10% 10%, #d1f5ee 0%, transparent 38%),
          radial-gradient(circle at 90% 15%, #fce8c9 0%, transparent 42%),
          var(--bg);
        color: var(--ink);
        line-height: 1.4;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 3vw, 2.2rem);
      }

      .intro {
        color: var(--muted);
        margin-bottom: 20px;
      }

      .status {
        padding: 12px 14px;
        border-radius: 10px;
        font-weight: 600;
        margin-bottom: 20px;
        border: 1px solid var(--border);
      }

      .status.pass {
        color: var(--pass);
        background: #f0fdf4;
      }

      .status.fail {
        color: var(--fail);
        background: #fff1f2;
      }

      #validation-summary,
      .profile-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 12px;
      }

      th,
      td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .columns {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      h2 {
        margin: 0 0 10px;
      }

      h3 {
        margin: 10px 0;
        color: var(--accent);
        font-size: 0.95rem;
      }

      ol,
      ul {
        margin: 0;
        padding-left: 18px;
      }

      li {
        margin-bottom: 6px;
      }

      code,
      small {
        color: var(--muted);
      }

      @media (max-width: 680px) {
        main {
          padding: 16px;
        }

        th,
        td {
          font-size: 0.83rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sentence Suitability Validation</h1>
      <p class="intro">
        Browser harness for Task 05. Compares known-ratio baseline ranking against the prototype multi-signal scorer across beginner and intermediate profiles.
      </p>
      <div id="validation-status" class="status">Running validation...</div>
      <section id="validation-summary"></section>
      <section id="validation-profiles"></section>
    </main>
    <script type="module" src="/src/validation/sentence-suitability/index.ts"></script>
  </body>
</html>
