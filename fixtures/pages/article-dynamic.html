<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImmersionKit Fixture - Dynamic Content</title>
  </head>
  <body>
    <main>
      <article id="feed">
        <h1>Live Community Bulletin</h1>
      </article>
    </main>
    <script>
      window.setTimeout(() => {
        const paragraph = document.createElement("p");
        paragraph.textContent =
          "Neighbors shared helpful updates about the clean park, the quiet library, and the weekly market downtown.";
        document.querySelector("#feed")?.appendChild(paragraph);
      }, 250);
    </script>
  </body>
</html>
